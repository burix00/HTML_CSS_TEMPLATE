<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard / App Layout</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="03-dashboard-app.css">
</head>
<body>
    <div class="layout-app">
        <aside class="sidebar" style="background: #2c3e50; color: #fff; padding: 20px;">
            <div class="logo">AppDash</div>
            <nav style="margin-top: 30px;">
                <ul style="list-style: none; padding: 0;">
                    <li style="margin-bottom: 15px;"><a href="#" style="color: #fff; text-decoration: none;">📄 Overview</a></li>
                    <li style="margin-bottom: 15px;"><a href="#" style="color: #fff; text-decoration: none;">📊 Analytics</a></li>
                    <li style="margin-bottom: 15px;"><a href="#" style="color: #fff; text-decoration: none;">👥 Users</a></li>
                    <li style="margin-bottom: 15px;"><a href="#" style="color: #fff; text-decoration: none;">⚙️ Settings</a></li>
                </ul>
            </nav>
        </aside>
        <main class="dashboard-content" style="padding: 20px;">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h1>Overview</h1>
                <div class="user-profile">Hello, Admin</div>
            </header>
            <section class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="card" style="padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 5px;">
                    <h3>Total Users</h3>
                    <p style="font-size: 24px; font-weight: bold;">1,245</p>
                    <span style="color: green;">+5.2% this week</span>
                </div>
                <div class="card" style="padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 5px;">
                    <h3>Revenue</h3>
                    <p style="font-size: 24px; font-weight: bold;">$12,400</p>
                    <span style="color: green;">+12% this week</span>
                </div>
                <div class="card" style="padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 5px;">
                    <h3>Active Sessions</h3>
                    <p style="font-size: 24px; font-weight: bold;">320</p>
                    <span style="color: red;">-2.1% this week</span>
                </div>
            </section>
            <section class="charts" style="background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 5px; height: 300px; display: flex; align-items: center; justify-content: center;">
                <p style="color: #777;">Chart Placeholder: Monthly Revenue</p>
            </section>
        </main>
    </div>
</body>
</html>
